services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-nova}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova} -d ${POSTGRES_DB:-nova}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://nova:change-me@postgres:5432/nova}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql+psycopg://nova:change-me@postgres:5432/nova}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    secrets:
      - source: jwt_private
        target: /run/secrets/jwt_private.pem
      - source: jwt_public
        target: /run/secrets/jwt_public.pem
      - source: firebase_service_account
        target: /run/secrets/firebase-service-account.json
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  api:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://nova:change-me@postgres:5432/nova}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql+psycopg://nova:change-me@postgres:5432/nova}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-service-account.json
    secrets:
      - source: jwt_private
        target: /run/secrets/jwt_private.pem
      - source: jwt_public
        target: /run/secrets/jwt_public.pem
      - source: firebase_service_account
        target: /run/secrets/firebase-service-account.json
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8000"

  scheduler:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "nova.scheduler_main"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://nova:change-me@postgres:5432/nova}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql+psycopg://nova:change-me@postgres:5432/nova}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-service-account.json
    secrets:
      - source: jwt_private
        target: /run/secrets/jwt_private.pem
      - source: jwt_public
        target: /run/secrets/jwt_public.pem
      - source: firebase_service_account
        target: /run/secrets/firebase-service-account.json
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      NOVA_DOMAIN: ${NOVA_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

secrets:
  jwt_private:
    file: ./secrets/jwt_private.pem
  jwt_public:
    file: ./secrets/jwt_public.pem
  firebase_service_account:
    file: ./secrets/firebase-service-account.json

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
