[project]
name = "nova-backapp"
version = "0.1.0"
description = "FastAPI backend for the Asistente Tecnologico Inteligente"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "firebase-admin>=6.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dateutil>=2.9",
    "pyjwt>=2.10",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "TCH"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E402"]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["nova"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["nova"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_generics = true
disable_error_code = ["empty-body"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "firebase_admin.*", "dateutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
