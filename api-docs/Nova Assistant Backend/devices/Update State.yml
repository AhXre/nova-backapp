info:
  name: Update State
  type: http
  seq: 2
  tags:
    - devices

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/devices/me/state"
  body:
    type: json
    data: |-
      {
        "state": "",
        "app_version": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 204 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/devices/me/state"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "state": "",
            "app_version": ""
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/devices/me/state"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "state": "",
            "app_version": ""
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }
