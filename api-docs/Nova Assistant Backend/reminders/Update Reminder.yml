    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/reminders/:reminder_id"
      method: PATCH
      params:
        - name: reminder_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "content": "",
            "due_at": "",
            "recurrence": "",
            "expected_version": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "user_id": "",
            "content": "",
            "due_at": "",
            "recurrence": "",
            "status": "pending",
