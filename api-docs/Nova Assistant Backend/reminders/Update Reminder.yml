info:
  name: Update Reminder
  type: http
  seq: 4
  tags:
    - reminders

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/reminders/:reminder_id"
  params:
    - name: reminder_id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "content": "",
        "due_at": "",
        "recurrence": "",
        "expected_version": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
