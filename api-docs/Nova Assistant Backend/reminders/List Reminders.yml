info:
  name: List Reminders
  type: http
  seq: 2
  tags:
    - reminders

http:
  method: GET
  url: "{{baseUrl}}/api/v1/reminders"
  params:
    - name: limit
      value: "100"
      type: query
    - name: offset
      value: "0"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/reminders"
      method: GET
      params:
        - name: limit
          value: "100"
          type: query
        - name: offset
          value: "0"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "user_id": "",
              "content": "",
              "due_at": "",
              "recurrence": "",
              "status": "pending",
              "origin": "device",
              "version": 0,
              "created_at": "",
              "updated_at": "",
              "deleted_at": ""
            }
          ]
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/reminders"
      method: GET
      params:
        - name: limit
          value: "100"
          type: query
        - name: offset
          value: "0"
          type: query
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }
