info:
  name: Issue Pairing Code
  type: http
  seq: 5
  tags:
    - auth

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/pairing-code"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/auth/pairing-code"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "expires_at": ""
          }
