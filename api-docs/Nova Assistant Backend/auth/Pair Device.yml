info:
  name: Pair Device
  type: http
  seq: 6
  tags:
    - auth

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/pair"
  body:
    type: json
    data: |-
      {
        "code": "",
        "name": "",
        "app_version": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/auth/pair"
      method: POST
      body:
        type: json
        data: |-
          {
            "code": "",
            "name": "",
            "app_version": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "access_token": "",
            "device_id": ""
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/auth/pair"
      method: POST
      body:
        type: json
        data: |-
          {
            "code": "",
            "name": "",
            "app_version": ""
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }
